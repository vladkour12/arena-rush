<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Permissive CSP for local dev to allow backend calls and websockets -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * ws: wss: http: https: data: blob:; img-src * data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline' data: blob:; font-src * data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arena Rush" />
    <meta name="description" content="Fast-paced battle royale shooter game for mobile. Loot weapons, shoot enemies, and be the last one standing!" />
    <meta name="keywords" content="battle royale, shooter, game, mobile game, action game, pvp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-512.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-512.svg" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-192.svg" />
    <title>Arena Rush: Loot & Shoot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
  <body class="bg-gray-900 text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Disable SW during local dev to avoid stale cached bundles / double React copies
      const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (isLocal) {
            navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
            return;
          }
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* ignore */
          });
        });
      }
    </script>
  </body>
</html>
